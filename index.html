<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>चाय गरम | Chai Garam</title>
<meta name="description" content="असली अड्डे की चाय — गरम, ताज़ा, और अपनों जैसी।">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍵</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="hero">
  <div class="hero__bg" aria-hidden="true">
    <video class="hero__scene" autoplay loop muted playsinline preload="auto" poster="chai.jpeg">
      <source src="b_Animate_this_image_a.mp4" type="video/mp4">
    </video>
    <div class="hero__vignette"></div>
  </div>

  <div class="hero__topbar">
    <span class="hero__clock" id="liveClock">--:--</span>
  </div>

  <div class="hero__content">
    <h1 class="sr-only">चाय गरम</h1>
    <p class="hero__tagline">गरम कड़क चाय, ताज़ी भाप, अपनों वाली बातें</p>
  </div>

  <!-- floating audio player, backed by a YouTube playlist -->
  <div class="player" id="player">
    <div class="player__art" id="ytThumb" aria-hidden="true"><span id="ytThumbFallback">🎵</span></div>
    <div class="player__meta">
      <p class="player__title" id="trackTitle">लोड हो रहा है…</p>
      <p class="player__artist" id="trackArtist">Chai Garam Radio</p>
      <div class="player__progress">
        <div class="player__progress-bar" id="progressBar"></div>
      </div>
      <div class="player__time"><span id="curTime">0:00</span> / <span id="durTime">0:00</span></div>
    </div>
    <div class="player__controls">
      <button id="prevBtn" aria-label="पिछला">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6L18 6v12z"/></svg>
      </button>
      <button id="playBtn" aria-label="चलाएं/रोकें">
        <svg id="playIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button id="nextBtn" aria-label="अगला">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
      </button>
    </div>
    <!-- hidden YouTube IFrame API host; audio plays from the playlist, video surface is not shown -->
    <div id="yt-player" class="player__yt-host" aria-hidden="true"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
