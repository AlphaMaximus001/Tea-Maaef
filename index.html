<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>चाय की टपरी</title>
<meta name="description" content="चाय की टपरी — दिन के हर पहर का अपना मिज़ाज़, अपनी चाय।">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🫖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="tapri" id="tapri">
  <div class="tapri__grain" aria-hidden="true"></div>
  <div class="tapri__vignette" aria-hidden="true"></div>

  <div class="tapri__scene" aria-hidden="true">
    <svg class="tapri__art" viewBox="0 0 900 900" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="glow" cx="50%" cy="35%" r="60%">
          <stop offset="0%" stop-color="var(--c-amber)" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="var(--c-amber)" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <ellipse cx="450" cy="700" rx="420" ry="120" fill="url(#glow)"/>

      <!-- wooden bench -->
      <rect x="120" y="640" width="660" height="34" rx="6" fill="var(--c-bench)"/>
      <rect x="120" y="640" width="660" height="8" rx="4" fill="var(--c-bench-light)" opacity="0.5"/>
      <rect x="150" y="674" width="26" height="130" fill="var(--c-bench-dark)"/>
      <rect x="724" y="674" width="26" height="130" fill="var(--c-bench-dark)"/>
      <g stroke="var(--c-bench-dark)" stroke-width="2" opacity="0.4">
        <line x1="220" y1="644" x2="220" y2="670"/>
        <line x1="340" y1="644" x2="340" y2="670"/>
        <line x1="460" y1="644" x2="460" y2="670"/>
        <line x1="580" y1="644" x2="580" y2="670"/>
        <line x1="680" y1="644" x2="680" y2="670"/>
      </g>

      <!-- steel kettle (right) -->
      <g id="kettle">
        <ellipse cx="590" cy="628" rx="98" ry="20" fill="#000" opacity="0.18"/>
        <path d="M510 560 Q510 480 590 470 Q670 480 670 560 Q670 610 590 616 Q510 610 510 560 Z" fill="var(--c-kettle)"/>
        <path d="M520 555 Q520 495 590 486" stroke="var(--c-brass)" stroke-width="4" fill="none" opacity="0.5"/>
        <path d="M665 545 Q715 530 705 470 Q698 440 665 448" stroke="var(--c-kettle)" stroke-width="16" fill="none" stroke-linecap="round"/>
        <path d="M555 470 Q590 440 625 470" stroke="var(--c-kettle-dark)" stroke-width="14" fill="none" stroke-linecap="round"/>
        <ellipse cx="590" cy="470" rx="20" ry="8" fill="var(--c-brass)"/>
        <circle cx="590" cy="466" r="6" fill="var(--c-kettle-dark)"/>
      </g>

      <!-- chipped glass kulhad (left) -->
      <g id="kulhad">
        <ellipse cx="330" cy="632" rx="66" ry="14" fill="#000" opacity="0.18"/>
        <path d="M285 560 L295 618 Q330 632 365 618 L375 560 Z" fill="var(--c-terracotta)"/>
        <path d="M285 560 L375 560 L370 575 L290 575 Z" fill="var(--c-terracotta-light)"/>
        <ellipse cx="330" cy="560" rx="45" ry="10" fill="var(--c-amber)" opacity="0.9"/>
        <!-- chip in the rim -->
        <path d="M352 552 Q360 548 366 554 Q362 560 353 559 Z" fill="var(--c-bench-dark)" opacity="0.55"/>
        <path d="M300 590 Q330 598 360 590" stroke="var(--c-terracotta-light)" stroke-width="2" fill="none" opacity="0.4"/>
      </g>
    </svg>

    <canvas class="tapri__steam" id="steamCanvas" aria-hidden="true"></canvas>
  </div>

  <header class="tapri__top">
    <div class="state-toggle" id="stateToggle" role="group" aria-label="पहर बदलें">
      <button type="button" data-state="subah">सुबह</button>
      <button type="button" data-state="shaam">शाम</button>
      <button type="button" data-state="raat">रात</button>
    </div>
  </header>

  <div class="tapri__content">
    <h1 class="wordmark">चाय की टपरी</h1>
    <p class="shayari" id="shayariLine"></p>
  </div>

  <!-- floating audio player, backed by a YouTube playlist -->
  <div class="player" id="player">
    <div class="player__art" id="ytThumb" aria-hidden="true"><span id="ytThumbFallback">🎵</span></div>
    <div class="player__meta">
      <p class="player__title" id="trackTitle">लोड हो रहा है…</p>
      <p class="player__artist" id="trackArtist">टपरी रेडियो</p>
      <div class="player__progress">
        <div class="player__progress-bar" id="progressBar"></div>
      </div>
      <div class="player__time"><span id="curTime">0:00</span> / <span id="durTime">0:00</span></div>
    </div>
    <div class="player__controls">
      <button id="prevBtn" aria-label="पिछला">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6L18 6v12z"/></svg>
      </button>
      <button id="playBtn" aria-label="चलाएं/रोकें">
        <svg id="playIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button id="nextBtn" aria-label="अगला">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
      </button>
    </div>
    <!-- bare embed iframe, controlled via raw postMessage (no youtube.com/iframe_api wrapper script) -->
    <iframe id="yt-player" class="player__yt-host" aria-hidden="true" allow="autoplay; encrypted-media" frameborder="0"></iframe>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
