<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>चाय अड्डा | Chai Adda</title>
<meta name="description" content="असली अड्डे की चाय — गरम, ताज़ा, और अपनों जैसी।">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍵</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="hero">
  <div class="hero__bg" aria-hidden="true">
    <svg class="hero__scene" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
      <!-- sky/back wall -->
      <rect x="0" y="0" width="1600" height="1000" fill="url(#skyGrad)"/>
      <!-- back wall -->
      <rect x="0" y="120" width="1600" height="620" fill="#8a2f1f"/>
      <rect x="0" y="120" width="1600" height="60" fill="#6f2417"/>
      <!-- stall roof -->
      <polygon points="60,300 1540,300 1480,180 120,180" fill="#5c1c10"/>
      <rect x="60" y="290" width="1480" height="24" fill="#3d130b"/>
      <!-- counter -->
      <rect x="120" y="640" width="1360" height="220" fill="#a83c22"/>
      <rect x="120" y="640" width="1360" height="18" fill="#c2532f"/>
      <!-- shelves with glasses -->
      <g fill="#e8a33d" opacity="0.9">
        <rect x="200" y="360" width="60" height="90" rx="6"/>
        <rect x="290" y="360" width="60" height="90" rx="6"/>
        <rect x="380" y="360" width="60" height="90" rx="6"/>
        <rect x="470" y="360" width="60" height="90" rx="6"/>
      </g>
      <!-- kettle body -->
      <ellipse cx="1150" cy="560" rx="150" ry="60" fill="#3d3d3d"/>
      <rect x="1000" y="470" width="300" height="110" rx="24" fill="#4a4a4a"/>
      <path d="M1300 500 Q1380 480 1370 430" stroke="#3a3a3a" stroke-width="26" fill="none" stroke-linecap="round"/>
      <rect x="1080" y="430" width="140" height="50" rx="18" fill="#2f2f2f"/>
      <!-- flame under kettle -->
      <g class="flame">
        <ellipse cx="1150" cy="640" rx="90" ry="18" fill="#2a2a2a"/>
        <path class="flame__core" d="M1120 630 Q1130 590 1150 560 Q1170 590 1180 630 Q1150 650 1120 630Z" fill="#ffb23d"/>
        <path class="flame__inner" d="M1135 625 Q1142 600 1150 585 Q1158 600 1165 625 Q1150 635 1135 625Z" fill="#ff5e1a"/>
      </g>
      <!-- steam plumes -->
      <g class="steam" stroke="#fff3e6" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.55">
        <path class="steam__1" d="M1090 470 Q1070 400 1100 340 Q1130 280 1100 220"/>
        <path class="steam__2" d="M1180 470 Q1200 400 1170 340 Q1140 280 1170 220"/>
        <path class="steam__3" d="M1150 470 Q1150 400 1130 340"/>
      </g>
      <!-- hanging bulb -->
      <line x1="800" y1="180" x2="800" y2="260" stroke="#2a2a2a" stroke-width="4"/>
      <circle class="bulb" cx="800" cy="278" r="20" fill="#ffe08a"/>
      <!-- stools / foreground silhouettes -->
      <g fill="#2b0f08" opacity="0.85">
        <rect x="80" y="880" width="70" height="90" rx="10"/>
        <rect x="1440" y="860" width="80" height="110" rx="10"/>
      </g>
      <defs>
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#e8703a"/>
          <stop offset="0.5" stop-color="#b9421f"/>
          <stop offset="1" stop-color="#3a0e08"/>
        </linearGradient>
      </defs>
    </svg>
    <div class="hero__vignette"></div>
  </div>

  <div class="hero__topbar">
    <span class="hero__clock" id="liveClock">--:--</span>
    <span class="hero__online"><i class="dot" aria-hidden="true"></i><span id="onlineCount">0</span> लोग यहाँ हैं</span>
  </div>

  <div class="hero__content">
    <p class="hero__eyebrow">रोज़ की अड्डेबाज़ी, एक कप चाय के साथ</p>
    <h1 class="hero__title">चाय अड्डा</h1>
    <p class="hero__tagline">गरम कड़क चाय, ताज़ी भाप, अपनों वाली बातें</p>
  </div>

  <!-- floating audio player, backed by a YouTube playlist -->
  <div class="player" id="player">
    <div class="player__art" id="ytThumb" aria-hidden="true"><span id="ytThumbFallback">🎵</span></div>
    <div class="player__meta">
      <p class="player__title" id="trackTitle">लोड हो रहा है…</p>
      <p class="player__artist" id="trackArtist">Chai Adda Radio</p>
      <div class="player__progress">
        <div class="player__progress-bar" id="progressBar"></div>
      </div>
      <div class="player__time"><span id="curTime">0:00</span> / <span id="durTime">0:00</span></div>
    </div>
    <div class="player__controls">
      <button id="prevBtn" aria-label="पिछला">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6L18 6v12z"/></svg>
      </button>
      <button id="playBtn" aria-label="चलाएं/रोकें">
        <svg id="playIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button id="nextBtn" aria-label="अगला">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
      </button>
    </div>
    <!-- hidden YouTube IFrame API host; audio plays from the playlist, video surface is not shown -->
    <div id="yt-player" class="player__yt-host" aria-hidden="true"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
